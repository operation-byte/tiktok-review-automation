name: BigSeller private login browser
on:
  workflow_dispatch:
    inputs:
      session:
        description: Private login session from dashboard or Telegram
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: bigseller-browser-state
  cancel-in-progress: false
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Singapore
      DISPLAY: ':99'
      LOGIN_SESSION: ${{ inputs.session }}
      CONTROL_URL: ${{ vars.CONTROL_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      BIGSELLER_STATE_ENCRYPTION_KEY: ${{ secrets.BIGSELLER_STATE_ENCRYPTION_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_IDS: ${{ secrets.TELEGRAM_ALLOWED_IDS }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-github.txt
            requirements-relogin.txt
      - name: Install browser and private display
        run: |
          python -m pip install -r requirements-relogin.txt
          python -m playwright install --no-shell chromium &
          browser=$!
          python -m playwright install-deps chromium
          sudo apt-get install -y --no-install-recommends x11vnc xvfb
          wait "$browser"
      - name: Open private BigSeller login
        run: python -m scripts.bigseller_login
      - name: Report setup failure
        if: failure() || cancelled()
        env:
          FAILURE_CONTEXT: bigseller-login
        run: python -m scripts.notify_failure
