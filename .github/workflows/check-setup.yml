name: Verify Telegram, history and Google setup (no TikTok actions)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: "1"
      AUTOMATION_SHOPS: ${{ vars.AUTOMATION_SHOPS || 'welive_main,snackersbox' }}
      GH_STATE_TOKEN: ${{ github.token }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_IDS: ${{ secrets.TELEGRAM_ALLOWED_IDS }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
      GOOGLE_SHEETS_MODE: ${{ vars.GOOGLE_SHEETS_MODE }}
      GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/secrets/google-service-account.json
      GOOGLE_SHEET_ID: 1Q_8FRZBSRmuL6ncKshjME1JccLWU0XaMvSCVspwvHKs
      GOOGLE_SHEET_TAB: Backend Data
      GOOGLE_WORKSHEET_GID: "298261214"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install setup-check dependencies (no Chromium required)
        run: python -m pip install -r requirements-github.txt
      - name: Prepare private Google credentials if supplied
        shell: bash
        run: |
          mkdir -p secrets
          chmod 700 secrets
          if [[ -n "$GOOGLE_SERVICE_ACCOUNT_B64" ]]; then
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_B64" | base64 --decode > secrets/google-service-account.json
            chmod 600 secrets/google-service-account.json
          fi
      - name: Check Telegram, encrypted state and Google connection
        run: python -m scripts.check_setup
