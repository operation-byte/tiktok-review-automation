name: TikTok daily review checks

on:
  schedule:
    # 09:15 every day, Singapore time. Runs can be delayed by GitHub.
    - cron: "15 9 * * *"
      timezone: "Asia/Singapore"
  workflow_dispatch:
    inputs:
      shop:
        type: choice
        options: [all, welive_main, snackersbox, konomi_living]
        default: all
        description: Shop to check

permissions:
  contents: write  # only used to store encrypted state in automation-state branch

concurrency:
  group: tiktok-daily-review-state
  cancel-in-progress: false

jobs:
  check-all-shops:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    env:
      CONTROL_URL: ${{ vars.CONTROL_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      REQUESTED_SHOP: ${{ inputs.shop || 'all' }}
      TZ: Asia/Singapore
      PYTHONUNBUFFERED: "1"
      GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_IDS: ${{ secrets.TELEGRAM_ALLOWED_IDS }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
      GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${{ github.workspace }}/secrets/google-service-account.json
      AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
      AUTOMATION_SHOPS: ${{ vars.AUTOMATION_SHOPS || 'welive_main,snackersbox,konomi_living' }}
      ENABLE_SUBMIT: ${{ vars.ENABLE_SUBMIT }}
      BROWSER_CHANNEL: chrome
      BROWSER_HEADLESS: "false"
      GOOGLE_SHEETS_MODE: ${{ vars.GOOGLE_SHEETS_MODE }}
      GOOGLE_SHEET_ID: 1Q_8FRZBSRmuL6ncKshjME1JccLWU0XaMvSCVspwvHKs
      GOOGLE_SHEET_TAB: Backend Data
      GOOGLE_WORKSHEET_GID: "298261214"
      GOOGLE_SHEETS_SYNC_FROM: ${{ vars.GOOGLE_SHEETS_SYNC_FROM }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-github.txt
      - name: Install Python packages, Google Chrome and virtual display
        run: |
          python -m pip install -r requirements-github.txt
          # Same browser as the Windows PC: real Chrome in a window. The runner
          # image ships Chrome and Xvfb; install them only if they are missing.
          command -v google-chrome >/dev/null || python -m playwright install --with-deps chrome
          command -v xvfb-run >/dev/null || sudo apt-get install -y --no-install-recommends xvfb
          google-chrome --version
      - name: Prepare private Google credentials
        shell: bash
        run: |
          mkdir -p secrets
          chmod 700 secrets
          if [[ -n "$GOOGLE_SERVICE_ACCOUNT_B64" ]]; then
            printf '%s' "$GOOGLE_SERVICE_ACCOUNT_B64" | base64 --decode > secrets/google-service-account.json
            chmod 600 secrets/google-service-account.json
          fi
      - name: Run selected shops in parallel
        id: run_reviews
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" python github_daily.py
      - name: Alert when runner failed before reporting
        if: failure() || cancelled()
        run: python scripts/notify_failure.py
