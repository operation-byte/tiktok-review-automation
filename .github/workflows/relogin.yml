name: Private TikTok relogin browser
on:
  workflow_dispatch:
    inputs:
      shop:
        description: Shop to refresh
        required: true
        type: choice
        options: [welive_main, snackersbox, konomi_living]
      session:
        description: Private session identifier from Telegram
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: tiktok-daily-review-state
  cancel-in-progress: false
jobs:
  relogin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Singapore
      DISPLAY: ':99'
      AUTOMATION_SHOPS: welive_main,snackersbox,konomi_living
      LOGIN_SHOP: ${{ inputs.shop }}
      LOGIN_SESSION: ${{ inputs.session }}
      CONTROL_URL: ${{ vars.CONTROL_URL }}
      CONTROL_TOKEN: ${{ secrets.CONTROL_TOKEN }}
      GH_STATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_IDS: ${{ secrets.TELEGRAM_ALLOWED_IDS }}
      TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-github.txt
            requirements-relogin.txt
      - name: Install browser and private display
        run: |
          python -m pip install -r requirements-relogin.txt
          python -m playwright install --with-deps chromium
          XVFB_PKG=""
          command -v Xvfb >/dev/null || XVFB_PKG=xvfb
          sudo apt-get install -y --no-install-recommends x11vnc $XVFB_PKG
      - name: Open bounded login session
        run: python -m scripts.remote_login
      - name: Notify setup failure
        if: failure() || cancelled()
        env:
          FAILURE_CONTEXT: relogin
        run: python -m scripts.notify_failure
